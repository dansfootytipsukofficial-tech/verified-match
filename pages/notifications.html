<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Verified Match</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; min-height: 100vh; }
.topbar { background: #667eea; color: white; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
.topbar .logo { font-size: 20px; font-weight: 700; }
.topbar nav a { color: rgba(255,255,255,0.85); text-decoration: none; margin-left: 16px; font-size: 14px; }
.topbar nav a.active { color: white; font-weight: 600; }
.logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
.page { max-width: 700px; margin: 0 auto; padding: 30px 20px; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.page-header h1 { font-size: 24px; color: #333; }
.clear-btn { background: none; border: 2px solid #e0e0e0; color: #888; padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; }
.clear-btn:hover { border-color: #ff4757; color: #ff4757; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab { padding: 7px 18px; border-radius: 20px; border: 2px solid #e0e0e0; background: white; font-size: 13px; cursor: pointer; color: #666; font-weight: 500; transition: all 0.2s; }
.tab.active { background: #667eea; color: white; border-color: #667eea; }
.notif-list { display: flex; flex-direction: column; gap: 10px; }
.notif-item { background: white; border-radius: 14px; padding: 16px 18px; display: flex; align-items: flex-start; gap: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s; border-left: 4px solid transparent; }
.notif-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); transform: translateX(2px); }
.notif-item.unread { border-left-color: #667eea; background: #f8f9ff; }
.notif-item.unread .notif-title { font-weight: 700; }
.notif-icon { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.notif-icon.match { background: #fce4ec; }
.notif-icon.like { background: #fce4ec; }
.notif-icon.msg { background: #e8eaf6; }
.notif-icon.visit { background: #e8f5e9; }
.notif-icon.system { background: #fff8e1; }
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-size: 14px; color: #333; margin-bottom: 3px; }
.notif-desc { font-size: 13px; color: #888; line-height: 1.4; }
.notif-time { font-size: 11px; color: #bbb; margin-top: 5px; }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: #667eea; flex-shrink: 0; margin-top: 6px; }
.notif-dot.read { background: transparent; }
.empty { text-align: center; padding: 60px 20px; color: #aaa; }
.empty .icon { font-size: 56px; margin-bottom: 14px; }
.unread-count { background: #667eea; color: white; border-radius: 10px; padding: 2px 8px; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">💜 Verified Match</div>
  <nav>
    <a href="./dashboard.html">Home</a>
    <a href="./browse.html">Browse</a>
    <a href="./matches.html">Matches</a>
    <a href="./messages.html">Messages</a>
    <a href="./notifications.html" class="active">Alerts</a>
    <a href="./profile.html">Profile</a>
  </nav>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>
<div class="page">
  <div class="page-header">
    <h1>🔔 Notifications <span class="unread-count" id="unreadCount">0</span></h1>
    <button class="clear-btn" onclick="markAllRead()">Mark all as read</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('all',this)">All</button>
    <button class="tab" onclick="showTab('match',this)">Matches</button>
    <button class="tab" onclick="showTab('msg',this)">Messages</button>
    <button class="tab" onclick="showTab('like',this)">Likes</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>
<script>
const session = JSON.parse(localStorage.getItem('vm_session')||'null');
if(!session){window.location.href='./login.html';}

let notifs = JSON.parse(localStorage.getItem('vm_notifs')||'null') || [
  {id:1,type:'match',icon:'💘',title:'New Match!',desc:'You and Sophie Brown matched! Say hello.',time:'2 minutes ago',unread:true,link:'./messages.html'},
  {id:2,type:'msg',icon:'💬',title:'New message from Emma',desc:'"Haha yes! I love hiking too"',time:'15 minutes ago',unread:true,link:'./messages.html'},
  {id:3,type:'like',icon:'❤️',title:'Charlotte liked your profile',desc:'Charlotte Davis thinks you two would get along!',time:'1 hour ago',unread:true,link:'./matches.html'},
  {id:4,type:'match',icon:'💘',title:'New Match!',desc:'You and Olivia Brown matched!',time:'3 hours ago',unread:false,link:'./messages.html'},
  {id:5,type:'visit',icon:'👀',title:'Someone visited your profile',desc:'A Premium member checked out your profile.',time:'4 hours ago',unread:false,link:'./profile.html'},
  {id:6,type:'like',icon:'❤️',title:'Jessica liked your profile',desc:'Jessica Williams swiped right on you!',time:'Yesterday',unread:false,link:'./matches.html'},
  {id:7,type:'msg',icon:'💬',title:'New message from Olivia',desc:'"Thanks for the recommendation!"',time:'Yesterday',unread:false,link:'./messages.html'},
  {id:8,type:'system',icon:'⭐',title:'Your profile is trending!',desc:'You are in the top 10% most viewed profiles this week.',time:'2 days ago',unread:false,link:'./profile.html'},
  {id:9,type:'like',icon:'❤️',title:'5 people liked your profile today',desc:'You are popular! Check your matches.',time:'2 days ago',unread:false,link:'./matches.html'},
  {id:10,type:'system',icon:'🛡️',title:'Verification complete',desc:'Your profile is now verified. You will get more matches!',time:'3 days ago',unread:false,link:'./profile.html'}
];

let currentTab = 'all';

function updateCount(){
  const n = notifs.filter(x=>x.unread).length;
  document.getElementById('unreadCount').textContent = n;
  document.getElementById('unreadCount').style.display = n>0?'inline':'none';
}

function showTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderNotifs();
}

function renderNotifs(){
  const list = document.getElementById('notifList');
  let filtered = notifs;
  if(currentTab !== 'all') filtered = notifs.filter(n=>n.type===currentTab);
  if(filtered.length===0){
    list.innerHTML='<div class="empty"><div class="icon">🔔</div><h3>No notifications here</h3></div>';
    return;
  }
  list.innerHTML = filtered.map(n=>`
    <div class="notif-item${n.unread?' unread':''}" onclick="openNotif(${n.id})">
      <div class="notif-icon ${n.type}">${n.icon}</div>
      <div class="notif-body">
        <div class="notif-title">${n.title}</div>
        <div class="notif-desc">${n.desc}</div>
        <div class="notif-time">${n.time}</div>
      </div>
      <div class="notif-dot${n.unread?'':' read'}"></div>
    </div>`).join('');
}

function openNotif(id){
  const n = notifs.find(x=>x.id===id);
  if(n){ n.unread=false; save(); updateCount(); renderNotifs(); window.location.href=n.link; }
}

function markAllRead(){
  notifs.forEach(n=>n.unread=false);
  save(); updateCount(); renderNotifs();
}

function save(){ localStorage.setItem('vm_notifs',JSON.stringify(notifs)); }

function logout(){
  localStorage.removeItem('vm_session');
  localStorage.removeItem('vm_current_user');
  window.location.href='./login.html';
}

updateCount();
renderNotifs();
</script>
</body>
</html>
