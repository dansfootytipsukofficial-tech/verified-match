<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches - Verified Match</title>
    <link rel="stylesheet" href="../css/dark-mode.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; min-height: 100vh; }
.topbar { background: #667eea; color: white; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
.topbar .logo { font-size: 20px; font-weight: 700; }
.topbar nav a { color: rgba(255,255,255,0.85); text-decoration: none; margin-left: 16px; font-size: 14px; }
.topbar nav a.active { color: white; font-weight: 600; }
.logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
.page { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
.page-header { margin-bottom: 28px; }
.page-header h1 { font-size: 26px; color: #333; margin-bottom: 6px; }
.page-header p { color: #888; font-size: 14px; }
.tabs { display: flex; gap: 8px; margin-bottom: 28px; }
.tab { padding: 8px 22px; border-radius: 22px; border: 2px solid #e0e0e0; background: white; font-size: 14px; cursor: pointer; color: #666; font-weight: 500; transition: all 0.2s; }
.tab.active { background: #667eea; color: white; border-color: #667eea; }
.tab:hover:not(.active) { border-color: #667eea; color: #667eea; }
.match-count { background: #ff4757; color: white; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.match-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.07); transition: transform 0.2s, box-shadow 0.2s; }
.match-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
.card-photo { height: 200px; display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: 700; color: white; position: relative; }
.verified-badge { position: absolute; top: 10px; right: 10px; background: #00c853; color: white; font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
.new-badge { position: absolute; top: 10px; left: 10px; background: #ff4757; color: white; font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
.card-body { padding: 16px; }
.card-body h3 { font-size: 16px; color: #333; margin-bottom: 2px; }
.card-body .location { font-size: 12px; color: #888; margin-bottom: 10px; }
.compat { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.compat-bar { flex: 1; height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
.compat-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 3px; }
.compat-pct { font-size: 13px; font-weight: 700; color: #667eea; }
.interests { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.tag { background: #f0f3ff; color: #667eea; font-size: 11px; padding: 3px 9px; border-radius: 10px; }
.card-actions { display: flex; gap: 8px; }
.btn-msg { flex: 1; background: #667eea; color: white; border: none; padding: 9px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; }
.btn-msg:hover { background: #5a6fd6; }
.btn-view { flex: 1; background: white; color: #667eea; border: 2px solid #667eea; padding: 9px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
.btn-view:hover { background: #f0f3ff; }
.empty { text-align: center; padding: 60px 20px; color: #aaa; }
.empty .icon { font-size: 60px; margin-bottom: 16px; }
.empty h3 { font-size: 20px; color: #666; margin-bottom: 8px; }
.empty a { color: #667eea; text-decoration: none; font-weight: 600; }
.matched-on { font-size: 11px; color: #bbb; margin-top: 4px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">💜 Verified Match</div>
  <nav>
    <a href="./dashboard.html">Home</a>
    <a href="./browse.html">Browse</a>
    <a href="./matches.html" class="active">Matches</a>
    <a href="./messages.html">Messages</a>
    <a href="./notifications.html">Alerts</a>
    <a href="./profile.html">Profile</a>
  </nav>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>
<div class="page">
  <div class="page-header">
    <h1>Your Matches 💘</h1>
    <p>People who liked you back — start a conversation!</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('all',this)">All Matches <span class="match-count" id="allCount">0</span></button>
    <button class="tab" onclick="showTab('new',this)">New <span class="match-count" id="newCount">0</span></button>
    <button class="tab" onclick="showTab('liked',this)">Liked You First</button>
  </div>
  <div class="grid" id="matchGrid"></div>
</div>
<script>
const session = JSON.parse(localStorage.getItem('vm_session')||'null');
if(!session){window.location.href='./login.html';}

const matches = [
  {id:1,name:'Sophie Brown',age:25,location:'London',color:'#e91e63',initial:'SB',compat:94,interests:['Yoga','Travel','Coffee'],verified:true,isNew:true,matchedOn:'Today',likedFirst:false},
  {id:2,name:'Emma Clarke',age:27,location:'Manchester',color:'#9c27b0',initial:'EC',compat:88,interests:['Hiking','Reading','Art'],verified:true,isNew:true,matchedOn:'Today',likedFirst:true},
  {id:3,name:'Jessica Williams',age:30,location:'London',color:'#ff9800',initial:'JW',compat:85,interests:['Cooking','Travel','Music'],verified:false,isNew:false,matchedOn:'Yesterday',likedFirst:false},
  {id:4,name:'Olivia Brown',age:27,location:'Birmingham',color:'#4caf50',initial:'OB',compat:81,interests:['Fitness','Dogs','Food'],verified:true,isNew:false,matchedOn:'2 days ago',likedFirst:true},
  {id:5,name:'Charlotte Davis',age:24,location:'Bristol',color:'#f44336',initial:'CD',compat:79,interests:['Music','Photography','Cats'],verified:true,isNew:false,matchedOn:'3 days ago',likedFirst:false},
  {id:6,name:'Amelia Wilson',age:26,location:'Leeds',color:'#00bcd4',initial:'AW',compat:76,interests:['Running','Brunch','Netflix'],verified:false,isNew:false,matchedOn:'5 days ago',likedFirst:true},
  {id:7,name:'Grace Taylor',age:29,location:'London',color:'#607d8b',initial:'GT',compat:73,interests:['Theatre','Wine','Travel'],verified:true,isNew:false,matchedOn:'1 week ago',likedFirst:false},
  {id:8,name:'Isla Martin',age:23,location:'Edinburgh',color:'#795548',initial:'IM',compat:71,interests:['Art','Cycling','Vegan'],verified:true,isNew:false,matchedOn:'1 week ago',likedFirst:true}
];

document.getElementById('allCount').textContent = matches.length;
document.getElementById('newCount').textContent = matches.filter(m=>m.isNew).length;

let currentTab = 'all';

function showTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('matchGrid');
  let list = matches;
  if(currentTab === 'new') list = matches.filter(m=>m.isNew);
  if(currentTab === 'liked') list = matches.filter(m=>m.likedFirst);
  if(list.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="icon">💔</div><h3>No matches here yet</h3><p>Keep swiping on <a href="./browse.html">Browse</a></p></div>';
    return;
  }
  grid.innerHTML = list.map(m => `
    <div class="match-card">
      <div class="card-photo" style="background:${m.color}">
        ${m.initial}
        ${m.verified ? '<span class="verified-badge">✓ Verified</span>' : ''}
        ${m.isNew ? '<span class="new-badge">New!</span>' : ''}
      </div>
      <div class="card-body">
        <h3>${m.name}, ${m.age}</h3>
        <div class="location">📍 ${m.location}</div>
        <div class="compat">
          <div class="compat-bar"><div class="compat-fill" style="width:${m.compat}%"></div></div>
          <span class="compat-pct">${m.compat}%</span>
        </div>
        <div class="interests">${m.interests.map(i=>'<span class="tag">'+i+'</span>').join('')}</div>
        <div class="matched-on">Matched ${m.matchedOn}</div>
        <div class="card-actions" style="margin-top:10px">
          <button class="btn-msg" onclick="msgMatch('${m.name}')">💬 Message</button>
          <button class="btn-view" onclick="alert('Profile view coming soon!')">View</button>
        </div>
      </div>
    </div>`).join('');
}

function msgMatch(name) {
  localStorage.setItem('vm_open_chat', name);
  window.location.href = './messages.html';
}

function logout() {
  localStorage.removeItem('vm_session');
  localStorage.removeItem('vm_current_user');
  window.location.href = './login.html';
}

renderGrid();
</script>
    <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    <script src="../js/theme.js"></script>
</body>
</html>
