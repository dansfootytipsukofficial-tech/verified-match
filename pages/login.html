<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Verified Match</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .login-container { width: 100%; max-width: 450px; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden; }
        .login-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; text-align: center; }
        .logo { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .logo-text { font-size: 1.5rem; font-weight: 600; }
        .tagline { font-size: 0.9rem; opacity: 0.9; margin-top: 0.5rem; }
        .login-content { padding: 2.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #333; }
        .form-group input { width: 100%; padding: 0.875rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .remember-forgot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .remember-forgot label { margin: 0; cursor: pointer; }
        .forgot-link { color: #667eea; text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }
        .login-btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .divider { text-align: center; margin: 1.5rem 0; position: relative; }
        .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #ddd; }
        .divider span { background: white; padding: 0 1rem; position: relative; color: #999; font-size: 0.9rem; }
        .social-login { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .social-btn { padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-weight: 500; transition: all 0.3s; }
        .social-btn:hover { border-color: #667eea; color: #667eea; }
        .signup-link { text-align: center; color: #666; font-size: 0.9rem; }
        .signup-link a { color: #667eea; text-decoration: none; font-weight: 600; }
        .signup-link a:hover { text-decoration: underline; }
        .checkbox { margin-right: 0.5rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">💕</div>
            <div class="logo-text">Verified Match</div>
            <div class="tagline">Find Your Perfect Match</div>
        </div>
        <div class="login-content">
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox" class="checkbox" name="remember"> Remember me</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            <div class="divider"><span>or</span></div>
            <div class="social-login">
                <button class="social-btn">Google</button>
                <button class="social-btn">Facebook</button>
            </div>
            <div class="signup-link">
                Don't have an account? <a href="#signup">Sign up now</a>
            </div>
        </div>
    </div>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            console.log('Login attempt:', {email, password});
            alert('Welcome! Redirecting to dashboard...');
            window.location.href = './dashboard.html';
        });
    </script>
</body>
</html>
