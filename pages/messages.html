<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - Verified Match</title>
    <link rel="stylesheet" href="../css/dark-mode.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
.topbar { background: #667eea; color: white; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar .logo { font-size: 20px; font-weight: 700; }
.topbar nav a { color: rgba(255,255,255,0.85); text-decoration: none; margin-left: 16px; font-size: 14px; }
.topbar nav a.active { color: white; font-weight: 600; }
.logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
.container { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 320px; background: white; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
.sidebar-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; }
.sidebar-header h2 { font-size: 18px; color: #333; }
.search-box { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
.search-box input { width: 100%; padding: 8px 14px; border: 1px solid #e0e0e0; border-radius: 20px; font-size: 14px; outline: none; }
.inbox-list { flex: 1; overflow-y: auto; }
.inbox-item { padding: 14px 16px; border-bottom: 1px solid #f8f8f8; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.2s; }
.inbox-item:hover { background: #f9f9f9; }
.inbox-item.active { background: #f0f4ff; border-left: 3px solid #667eea; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: #667eea; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; }
.inbox-info { flex: 1; min-width: 0; }
.inbox-name { font-weight: 600; font-size: 14px; color: #333; margin-bottom: 3px; }
.inbox-preview { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inbox-meta { text-align: right; font-size: 11px; color: #aaa; }
.unread-badge { background: #667eea; color: white; border-radius: 10px; padding: 2px 7px; font-size: 11px; margin-top: 4px; display: inline-block; }
.chat-area { flex: 1; display: flex; flex-direction: column; background: white; }
.chat-header { padding: 16px 20px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 14px; }
.chat-header .avatar { width: 42px; height: 42px; font-size: 16px; }
.chat-header-info h3 { font-size: 16px; color: #333; }
.chat-header-info p { font-size: 12px; color: #667eea; }
.messages-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.message { display: flex; align-items: flex-end; gap: 8px; max-width: 70%; }
.message.sent { align-self: flex-end; flex-direction: row-reverse; }
.message.received { align-self: flex-start; }
.msg-bubble { padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
.message.sent .msg-bubble { background: #667eea; color: white; border-bottom-right-radius: 4px; }
.message.received .msg-bubble { background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
.msg-time { font-size: 10px; color: #aaa; margin-bottom: 4px; white-space: nowrap; }
.message-input-area { padding: 16px 20px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; align-items: flex-end; }
.message-input-area textarea { flex: 1; padding: 10px 16px; border: 1px solid #e0e0e0; border-radius: 22px; font-size: 14px; outline: none; resize: none; font-family: inherit; }
.send-btn { background: #667eea; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.send-btn:hover { background: #5a6fd6; }
.no-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; }
.no-chat .icon { font-size: 64px; margin-bottom: 16px; }
.no-chat h3 { font-size: 18px; margin-bottom: 8px; color: #666; }
.online-tag { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">💜 Verified Match</div>
  <nav>
    <a href="./dashboard.html">Home</a>
    <a href="./browse.html">Browse</a>
    <a href="./matches.html">Matches</a>
    <a href="./messages.html" class="active">Messages</a>
    <a href="./notifications.html">Alerts</a>
    <a href="./profile.html">Profile</a>
  </nav>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>
<div class="container">
  <div class="sidebar">
    <div class="sidebar-header"><h2>Messages</h2></div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Search conversations..." oninput="filterConvos()"></div>
    <div class="inbox-list" id="inboxList"></div>
  </div>
  <div class="chat-area" id="chatArea">
    <div class="no-chat" id="noChat">
      <div class="icon">💬</div>
      <h3>Select a conversation</h3>
      <p>Choose someone to start chatting</p>
    </div>
    <div id="chatMain" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
      <div class="chat-header">
        <div class="avatar" id="chatAvatar"></div>
        <div class="chat-header-info">
          <h3 id="chatName"></h3>
          <p id="chatStatus">Online now</p>
        </div>
      </div>
      <div class="messages-list" id="messagesList"></div>
      <div class="message-input-area">
        <textarea id="msgInput" rows="1" placeholder="Type a message..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()">&#10148;</button>
      </div>
    </div>
  </div>
</div>
<script>
const session = JSON.parse(localStorage.getItem('vm_session')||'null');
if(!session){window.location.href='./login.html';}
let activeConvo=null;
const defaultConvos=[
{id:1,name:'Sophie',initial:'S',color:'#e91e63',lastMsg:'That sounds amazing! When are you free?',time:'2m ago',unread:2,online:true},
{id:2,name:'Emma',initial:'E',color:'#9c27b0',lastMsg:'Haha yes! I love hiking too',time:'15m ago',unread:0,online:true},
{id:3,name:'Charlotte',initial:'C',color:'#f44336',lastMsg:'Have you been to that new place in Soho?',time:'1h ago',unread:1,online:false},
{id:4,name:'Olivia',initial:'O',color:'#ff9800',lastMsg:'Thanks for the recommendation!',time:'3h ago',unread:0,online:false},
{id:5,name:'Amelia',initial:'A',color:'#4caf50',lastMsg:'Looking forward to it!',time:'Yesterday',unread:0,online:false}
];
const defaultMessages={
1:[{from:'them',text:'Hey! I saw you like travelling too',time:'10:02'},{from:'me',text:'Yes! Just got back from Portugal, it was incredible',time:'10:05'},{from:'them',text:'Oh wow, I have always wanted to go to Lisbon!',time:'10:06'},{from:'me',text:'You would love it - the food, the views... absolute dream',time:'10:08'},{from:'them',text:'That sounds amazing! When are you free?',time:'10:10'}],
2:[{from:'them',text:'Hi! I noticed you are into hiking',time:'Yesterday'},{from:'me',text:'Yeah! Did the Peak District last summer, loved it',time:'Yesterday'},{from:'them',text:'Haha yes! I love hiking too',time:'Yesterday'}],
3:[{from:'them',text:'Hey, your profile caught my eye!',time:'2 days ago'},{from:'me',text:'Hey Charlotte! Thanks, yours is great too',time:'2 days ago'},{from:'them',text:'Have you been to that new place in Soho?',time:'2 days ago'}],
4:[{from:'me',text:'You should try Dishoom if you have not already!',time:'5 Jan'},{from:'them',text:'Thanks for the recommendation!',time:'5 Jan'}],
5:[{from:'them',text:'Great chatting with you!',time:'3 Jan'},{from:'me',text:'Definitely! Looking forward to it',time:'3 Jan'}]
};
let convos=JSON.parse(localStorage.getItem('vm_convos')||'null')||defaultConvos;
let messages=JSON.parse(localStorage.getItem('vm_messages')||'null')||defaultMessages;
function save(){localStorage.setItem('vm_convos',JSON.stringify(convos));localStorage.setItem('vm_messages',JSON.stringify(messages));}
function renderInbox(list){
const el=document.getElementById('inboxList');el.innerHTML='';
list.forEach(c=>{
const div=document.createElement('div');
div.className='inbox-item'+(activeConvo===c.id?' active':'');
div.onclick=()=>openConvo(c.id);
div.innerHTML='<div class="avatar" style="background:'+c.color+'">'+c.initial+'</div><div class="inbox-info"><div class="inbox-name">'+c.name+(c.online?' <span class="online-tag">Online</span>':'')+'</div><div class="inbox-preview">'+c.lastMsg+'</div></div><div class="inbox-meta"><div>'+c.time+'</div>'+(c.unread>0?'<div class="unread-badge">'+c.unread+'</div>':'')+'</div>';
el.appendChild(div);});}
function openConvo(id){
activeConvo=id;
const c=convos.find(x=>x.id===id);
c.unread=0;save();renderInbox(convos);
document.getElementById('noChat').style.display='none';
const m=document.getElementById('chatMain');
m.style.display='flex';m.style.flexDirection='column';m.style.flex='1';m.style.overflow='hidden';
document.getElementById('chatAvatar').textContent=c.initial;
document.getElementById('chatAvatar').style.background=c.color;
document.getElementById('chatName').textContent=c.name;
document.getElementById('chatStatus').textContent=c.online?'Online now':'Last seen recently';
renderMsgs(id);}
function renderMsgs(id){
const list=document.getElementById('messagesList');list.innerHTML='';
(messages[id]||[]).forEach(m=>{
const div=document.createElement('div');
div.className='message '+(m.from==='me'?'sent':'received');
div.innerHTML='<div class="msg-bubble">'+m.text+'</div><div class="msg-time">'+m.time+'</div>';
list.appendChild(div);});list.scrollTop=list.scrollHeight;}
function sendMessage(){
const inp=document.getElementById('msgInput');
const text=inp.value.trim();
if(!text||!activeConvo)return;
const now=new Date();
const t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
if(!messages[activeConvo])messages[activeConvo]=[];
messages[activeConvo].push({from:'me',text,time:t});
const c=convos.find(x=>x.id===activeConvo);
c.lastMsg=text;c.time='Just now';save();renderMsgs(activeConvo);renderInbox(convos);inp.value='';
setTimeout(()=>{
const replies=['That is so interesting!','Haha love that!','Tell me more!','You are so funny!','We should meet up soon!','That is amazing!'];
const r=replies[Math.floor(Math.random()*replies.length)];
messages[activeConvo].push({from:'them',text:r,time:t});
c.lastMsg=r;save();renderMsgs(activeConvo);renderInbox(convos);},1200);}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function filterConvos(){const q=document.getElementById('searchInput').value.toLowerCase();renderInbox(convos.filter(c=>c.name.toLowerCase().includes(q)));}
function logout(){localStorage.removeItem('vm_session');localStorage.removeItem('vm_current_user');window.location.href='./login.html';}
renderInbox(convos);
</script>
    <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    <script src="../js/theme.js"></script>
</body>
</html>
