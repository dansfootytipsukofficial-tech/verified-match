<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse - Verified Match</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 500px; background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); overflow: hidden; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
        .card-stack { position: relative; width: 100%; height: 600px; padding: 30px; display: flex; align-items: center; justify-content: center; }
        .card { position: absolute; width: 100%; max-width: 350px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; cursor: grab; transition: all 0.3s; }
        .card:active { cursor: grabbing; }
        .card-image { width: 100%; height: 70%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; }
        .card-info { padding: 20px; }
        .card-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .card-details { font-size: 14px; color: #999; margin-bottom: 10px; }
        .card-interests { font-size: 12px; color: #667eea; }
        .actions { display: flex; gap: 15px; padding: 20px; justify-content: center; }
        .btn { border: none; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; font-size: 24px; transition: all 0.3s; }
        .btn-pass { background: #e0e0e0; color: #999; }
        .btn-pass:hover { background: #bdbdbd; transform: scale(1.1); }
        .btn-like { background: #e74c3c; color: white; }
        .btn-like:hover { background: #c0392b; transform: scale(1.1); }
        .btn-super { background: #667eea; color: white; }
        .btn-super:hover { background: #764ba2; transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Discover Matches</h1>
            <p>Swipe to find your perfect connection</p>
        </header>
        <div class="card-stack">
            <div class="card">
                <div class="card-image">Profile Photo</div>
                <div class="card-info">
                    <div class="card-name">Sophie Brown, 25</div>
                    <div class="card-details">London, UK</div>
                    <div class="card-interests">Yoga • Art • Travel • Coffee</div>
                </div>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-pass" title="Pass">✕</button>
            <button class="btn btn-super" title="Super Like">⭐</button>
            <button class="btn btn-like" title="Like">❤</button>
        </div>
    </div>
    <script src="../js/browse.js"></script>
</body>
</html>
